# Build a signed App Tester APK and publish it to Firebase App Distribution.
#   test         → GroovePlayer (dev release) → https://grooveplayer-backend-test.fly.dev
#   staging-test → GroovePlayer Staging       → https://grooveplayer-backend-staging.fly.dev
# Play Store / main uses the prod flavor and is not this workflow.
# Signing and Firebase credentials come from GitHub Actions secrets only.
# Do not echo those values. Distribute setup notes stay local and are not in this repo.

name: Distribute APK

on:
  workflow_dispatch:
    inputs:
      notes:
        description: Release notes shown to testers. Leave empty to use recent commits.
        required: false
        type: string
        default: ""
      groups:
        description: Firebase App Distribution group aliases (comma-separated)
        required: false
        type: string
        default: testers
      testers:
        description: Extra tester emails (comma-separated). matt.elmer24@gmail.com is always included.
        required: false
        type: string
        default: ""
  push:
    branches:
      - test
      - staging-test
    paths:
      - "app/**"
      - "gradle/**"
      - "build.gradle.kts"
      - "settings.gradle.kts"
      - "gradle.properties"
      - "gradlew"
      - "gradlew.bat"
      - ".github/workflows/distribute-apk.yml"

permissions:
  contents: read
  actions: write

# Newer push to the same ref cancels an older in-flight run, so a merge batch
# produces one App Tester release. The group includes the ref, so a staging-test
# run never cancels a test run, and the other way around. A cancelled run skips
# its run_number. test and staging-test share this workflow's run_number, so each
# lane's versionCode keeps increasing. The packages differ, so the codes are independent.
concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  distribute:
    runs-on: ubuntu-latest
    env:
      # Job-owned SDK. The runner image SDK under /usr/local is not writable, so caching
      # it reports a hit, fails to extract, then cannot save ("another job may be creating
      # this cache"). This directory is user-owned and is saved once under a stable key.
      ANDROID_SDK_ROOT: ${{ github.workspace }}/android-sdk
      ANDROID_HOME: ${{ github.workspace }}/android-sdk
    steps:
      - name: Checkout
        uses: actions/checkout@v7
        with:
          # Enough history for the release-notes commit list.
          fetch-depth: 50

      - name: Setup JDK 17
        uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: 17

      - name: Setup Gradle
        uses: gradle/actions/setup-gradle@v6
        with:
          # Writes are limited to the default branch (main) unless this is false.
          # Distribute runs on test, so this job must restore and write the build cache.
          # setup-java cache: gradle is intentionally not set; it would freeze caches/build-cache-1
          # on the first key hit and can disable this action when the Gradle User Home already exists.
          cache-read-only: false

      - name: Restore Android SDK packages
        id: android-sdk-cache
        uses: actions/cache/restore@v6
        with:
          path: ${{ github.workspace }}/android-sdk
          # Stable key: no run id, SHA, or file hash. Save once on a miss; later runs only restore.
          key: ${{ runner.os }}-android-sdk-platform-36-build-tools-36.0.0-cmdline-15859902-v1

      - name: Prepare Android SDK directory
        run: mkdir -p "${ANDROID_SDK_ROOT}"

      - name: Setup Android SDK
        uses: android-actions/setup-android@v4
        with:
          # Empty skips a package install here. Packages are installed below on a cache miss.
          # cmdline-tools default is 15859902, which is part of the cache key above.
          packages: ''

      - name: Install Android SDK packages
        if: steps.android-sdk-cache.outputs.cache-hit != 'true'
        run: |
          set -euo pipefail
          if [ -z "${ANDROID_SDK_ROOT:-}" ]; then
            echo "ANDROID_SDK_ROOT is not set."
            exit 1
          fi
          missing=0
          for rel in platforms/android-36 build-tools/36.0.0; do
            if [ ! -d "${ANDROID_SDK_ROOT}/${rel}" ]; then
              echo "Missing ${ANDROID_SDK_ROOT}/${rel}"
              missing=1
            fi
          done
          if [ "$missing" -eq 0 ]; then
            echo "Android SDK packages already present (cache hit: ${{ steps.android-sdk-cache.outputs.cache-hit }}). Skipping sdkmanager."
            exit 0
          fi
          echo "Installing platform-tools, cmdline-tools;latest, platforms;android-36, build-tools;36.0.0"
          # Licenses are already accepted by setup-android. Feed y so a prompt cannot hang the job.
          python3 - << 'PY'
          import subprocess
          import sys

          completed = subprocess.run(
              [
                  "sdkmanager",
                  "--install",
                  "platform-tools",
                  "cmdline-tools;latest",
                  "platforms;android-36",
                  "build-tools;36.0.0",
              ],
              input=b"y\n" * 10,
          )
          sys.exit(completed.returncode)
          PY

      - name: Save Android SDK packages
        if: steps.android-sdk-cache.outputs.cache-hit != 'true'
        uses: actions/cache/save@v6
        with:
          path: ${{ github.workspace }}/android-sdk
          key: ${{ steps.android-sdk-cache.outputs.cache-primary-key }}

      - name: Decode keystore
        env:
          ANDROID_KEYSTORE_BASE64: ${{ secrets.ANDROID_KEYSTORE_BASE64 }}
        run: |
          set -euo pipefail
          if [ -z "${ANDROID_KEYSTORE_BASE64}" ]; then
            echo "Missing secret ANDROID_KEYSTORE_BASE64."
            exit 1
          fi
          mkdir -p keystore
          printf '%s' "$ANDROID_KEYSTORE_BASE64" | tr -d ' \n\r\t' | base64 -d > keystore/grooveplayer-upload.jks
          if [ ! -s keystore/grooveplayer-upload.jks ]; then
            echo "Keystore decode failed or ANDROID_KEYSTORE_BASE64 is empty."
            exit 1
          fi
          echo "Decoded upload keystore ($(wc -c < keystore/grooveplayer-upload.jks) bytes)."

      - name: Select release lane
        id: lane
        run: |
          set -euo pipefail
          # staging-test is the side-by-side app. Every other run of this workflow,
          # including a manual dispatch from test, is the GroovePlayer tester lane.
          if [ "${GITHUB_REF_NAME}" = "staging-test" ]; then
            echo "Selected App Tester lane: staging (branch ${GITHUB_REF_NAME})."
            echo "name=staging" >> "$GITHUB_OUTPUT"
            echo "gradle_task=:app:assembleStagingRelease" >> "$GITHUB_OUTPUT"
            echo "apk=app/build/outputs/apk/staging/release/app-staging-release.apk" >> "$GITHUB_OUTPUT"
            echo "artifact=grooveplayer-staging-release" >> "$GITHUB_OUTPUT"
            echo "api_property=STAGING_API_BASE_URL" >> "$GITHUB_OUTPUT"
            echo "api_url=https://grooveplayer-backend-staging.fly.dev" >> "$GITHUB_OUTPUT"
          else
            echo "Selected App Tester lane: test (branch ${GITHUB_REF_NAME})."
            echo "name=test" >> "$GITHUB_OUTPUT"
            echo "gradle_task=:app:assembleDevRelease" >> "$GITHUB_OUTPUT"
            echo "apk=app/build/outputs/apk/dev/release/app-dev-release.apk" >> "$GITHUB_OUTPUT"
            echo "artifact=grooveplayer-dev-release" >> "$GITHUB_OUTPUT"
            echo "api_property=API_BASE_URL" >> "$GITHUB_OUTPUT"
            echo "api_url=https://grooveplayer-backend-test.fly.dev" >> "$GITHUB_OUTPUT"
          fi
      - name: Write local.properties
        env:
          RELEASE_STORE_PASSWORD: ${{ secrets.RELEASE_STORE_PASSWORD }}
          RELEASE_KEY_ALIAS: ${{ secrets.RELEASE_KEY_ALIAS }}
          RELEASE_KEY_PASSWORD: ${{ secrets.RELEASE_KEY_PASSWORD }}
          LANE_API_PROPERTY: ${{ steps.lane.outputs.api_property }}
          LANE_API_URL: ${{ steps.lane.outputs.api_url }}
        run: |
          set -euo pipefail
          python3 - << 'PY'
          import os
          from pathlib import Path

          keys = ("RELEASE_STORE_PASSWORD", "RELEASE_KEY_ALIAS", "RELEASE_KEY_PASSWORD")
          missing = [key for key in keys if not os.environ.get(key)]
          if missing:
              raise SystemExit("Missing signing secrets: " + ", ".join(missing))

          def prop(value: str) -> str:
              # Java properties escapes. Never print the result.
              out = []
              for ch in value.replace("\n", "").replace("\r", ""):
                  if ch == "\\":
                      out.append("\\\\")
                  elif ord(ch) < 32 or ord(ch) > 126:
                      out.append("\\u%04x" % ord(ch))
                  else:
                      out.append(ch)
              return "".join(out)

          # App Tester installs on physical devices. Bake the lane API (not 10.0.2.2).
          # Web client ID must match backend verify; defaults match app/build.gradle.kts.
          # Staging uses the same web client. Its Android OAuth client is package + SHA-1.
          api_property = os.environ["LANE_API_PROPERTY"]
          api_url = os.environ["LANE_API_URL"]
          if api_property not in ("API_BASE_URL", "STAGING_API_BASE_URL"):
              raise SystemExit("Unexpected API property for this lane.")
          if not api_url.startswith("https://"):
              raise SystemExit("Lane API URL must be https.")
          lines = [
              "RELEASE_STORE_FILE=keystore/grooveplayer-upload.jks",
              f"RELEASE_STORE_PASSWORD={prop(os.environ['RELEASE_STORE_PASSWORD'])}",
              f"RELEASE_KEY_ALIAS={prop(os.environ['RELEASE_KEY_ALIAS'])}",
              f"RELEASE_KEY_PASSWORD={prop(os.environ['RELEASE_KEY_PASSWORD'])}",
              f"{api_property}={api_url}",
              "GOOGLE_WEB_CLIENT_ID=356328665268-h7p2ct3o1k8358itiecp3h6o4r1tjjgo.apps.googleusercontent.com",
              "GOOGLE_ANDROID_CLIENT_ID=356328665268-1t80fc2j091cei383co7tncernl4p00c.apps.googleusercontent.com",
          ]
          Path("local.properties").write_text("\n".join(lines) + "\n", encoding="ascii")
          print(f"Wrote local.properties with {api_property}={api_url} (secrets not shown).")
          PY

      - name: Export version
        run: |
          echo "VERSION_CODE=${{ github.run_number }}" >> "$GITHUB_ENV"
          echo "VERSION_NAME=1.0.${{ github.run_number }}" >> "$GITHUB_ENV"
          echo "VERSION_CODE=${{ github.run_number }}"
          echo "VERSION_NAME=1.0.${{ github.run_number }}"

      - name: Apply CI Gradle performance overrides
        run: |
          set -euo pipefail
          python3 - << 'PY'
          from pathlib import Path

          path = Path("gradle.properties")
          text = path.read_text(encoding="utf-8")
          # Local Mac keeps the conservative values in git. Replace them on the runner only.
          replacements = [
              ("org.gradle.parallel=false", "org.gradle.parallel=true"),
              ("org.gradle.workers.max=1", "org.gradle.workers.max=4"),
              ("-Xmx2048m", "-Xmx4g"),
              ("android.incremental=false", "android.incremental=true"),
              (
                  "android.useFullClasspathForDexingTransform=true",
                  "android.useFullClasspathForDexingTransform=false",
              ),
          ]
          for old, new in replacements:
              if old not in text:
                  raise SystemExit(f"gradle.properties is missing expected setting: {old}")
              text = text.replace(old, new, 1)
          if "org.gradle.caching=true" not in text:
              raise SystemExit("gradle.properties is missing org.gradle.caching=true")
          path.write_text(text, encoding="utf-8")
          print("Applied CI Gradle overrides.")
          print("parallel=true workers.max=4 heap=4g incremental=true fullClasspathDexing=false")
          print("Kept daemon=true, caching=true, vfs.watch=false, enableResourceOptimizations=false, enableAsmInstrumentation=false")
          PY

      - name: Build release APK
        env:
          VERSION_CODE: ${{ github.run_number }}
          VERSION_NAME: 1.0.${{ github.run_number }}
          GRADLE_TASK: ${{ steps.lane.outputs.gradle_task }}
        run: |
          echo "VERSION_CODE=${VERSION_CODE}"
          echo "VERSION_NAME=${VERSION_NAME}"
          echo "LANE=${{ steps.lane.outputs.name }}"
          # Configuration cache works for a fixed version, but versionCode/versionName are
          # read while configuring defaultConfig and change every run, so the entry would miss.
          # versionCode still comes from github.run_number. It is a task input only for the
          # manifest, BuildConfig, and packaging tasks. No timestamp is added to task inputs.
          case "$GRADLE_TASK" in
            :app:assembleDevRelease|:app:assembleStagingRelease) ;;
            *)
              echo "Unexpected Gradle task for this lane."
              exit 1
              ;;
          esac
          ./gradlew "$GRADLE_TASK" --stacktrace --build-cache --parallel --max-workers=4 \
            -Pandroid.incremental=true \
            -Pandroid.useFullClasspathForDexingTransform=false \
            -PversionCode="${VERSION_CODE}" \
            -PversionName="${VERSION_NAME}"

      - name: Check signed APK
        id: apk
        env:
          APK_PATH: ${{ steps.lane.outputs.apk }}
        run: |
          set -euo pipefail
          apk="$APK_PATH"
          if [ ! -f "$apk" ]; then
            echo "Signed APK not found at $apk"
            find app/build/outputs/apk -type f -name '*.apk' -print || true
            exit 1
          fi
          if [[ "$apk" == *unsigned* ]]; then
            echo "Refusing to publish an unsigned APK."
            exit 1
          fi
          echo "path=$apk" >> "$GITHUB_OUTPUT"
          echo "APK ready: $apk ($(wc -c < "$apk") bytes)."

      - name: Upload APK artifact
        uses: actions/upload-artifact@v7
        with:
          name: ${{ steps.lane.outputs.artifact }}
          path: ${{ steps.lane.outputs.apk }}
          if-no-files-found: error

      - name: Check Firebase secrets
        env:
          FIREBASE_APP_ID: ${{ secrets.FIREBASE_APP_ID }}
          FIREBASE_APP_ID_STAGING: ${{ secrets.FIREBASE_APP_ID_STAGING }}
          FIREBASE_SERVICE_ACCOUNT: ${{ secrets.FIREBASE_SERVICE_ACCOUNT }}
          LANE: ${{ steps.lane.outputs.name }}
        run: |
          set -euo pipefail
          if [ -z "${FIREBASE_SERVICE_ACCOUNT}" ]; then
            echo "Missing FIREBASE_SERVICE_ACCOUNT."
            exit 1
          fi
          if [ "$LANE" = "staging" ]; then
            if [ -z "${FIREBASE_APP_ID_STAGING}" ]; then
              echo "Missing FIREBASE_APP_ID_STAGING."
              exit 1
            fi
          elif [ -z "${FIREBASE_APP_ID}" ]; then
            echo "Missing FIREBASE_APP_ID."
            exit 1
          fi
          echo "Firebase App Distribution secrets are present."

      - name: Write release notes
        id: notes
        env:
          DISPATCH_NOTES: ${{ github.event.inputs.notes }}
          DISPATCH_TESTERS: ${{ github.event.inputs.testers }}
          DISPATCH_GROUPS: ${{ github.event.inputs.groups }}
          VAR_TESTERS: ${{ vars.FIREBASE_TESTERS }}
          VERSION_NAME: ${{ env.VERSION_NAME }}
          PUSH_BEFORE: ${{ github.event.before }}
        run: |
          set -euo pipefail
          python3 - << 'PY'
          import os
          import re
          import subprocess
          from pathlib import Path

          # Firebase allows much longer notes. Keep App Tester text under ~2KB.
          MAX_BYTES = 1800
          DEFAULT_TESTER = "matt.elmer24@gmail.com"

          def one_line_list(value: str) -> list[str]:
              items = []
              for chunk in value.replace("\n", ",").replace("\r", ",").split(","):
                  item = " ".join(chunk.split())
                  if item:
                      items.append(item)
              return items

          def cap(header: str, body: str) -> str:
              suffix = "\n...\n"
              full = f"{header}\n\n{body.strip()}\n"
              if len(full.encode("utf-8")) <= MAX_BYTES:
                  return full
              kept = []
              for line in body.strip().splitlines():
                  candidate_body = "\n".join(kept + [line])
                  candidate = f"{header}\n\n{candidate_body}{suffix}"
                  if len(candidate.encode("utf-8")) > MAX_BYTES:
                      break
                  kept.append(line)
              if kept:
                  return f"{header}\n\n" + "\n".join(kept) + suffix
              base = f"{header}{suffix}"
              raw = base.encode("utf-8")
              if len(raw) <= MAX_BYTES:
                  return base
              return raw[:MAX_BYTES].decode("utf-8", errors="ignore")

          event = os.environ.get("GITHUB_EVENT_NAME", "")
          version = os.environ.get("VERSION_NAME") or f"1.0.{os.environ.get('GITHUB_RUN_NUMBER', '0')}"
          sha = os.environ.get("GITHUB_SHA", "")
          short = sha[:7] if sha else "unknown"
          ref = os.environ.get("GITHUB_REF_NAME", "")
          app_label = "GroovePlayer Staging" if ref == "staging-test" else "GroovePlayer"
          header = f"{app_label} {version} ({short})"
          if ref:
              header += f" on {ref}"

          scrum_key = re.compile(r"SCRUM-\d+")

          def git_text(args: list[str]) -> str:
              try:
                  return subprocess.check_output(
                      ["git", "log", *args],
                      text=True,
                      stderr=subprocess.DEVNULL,
                  ).strip()
              except (subprocess.CalledProcessError, FileNotFoundError):
                  return ""

          def unique_scrum_keys(text: str) -> list[str]:
              seen: set[str] = set()
              keys: list[str] = []
              for key in scrum_key.findall(text or ""):
                  if key in seen:
                      continue
                  seen.add(key)
                  keys.append(key)
              return keys

          # Prefer commits on this push. Fall back to the recent log when the
          # previous SHA is missing (manual dispatch) or not in the checkout.
          before = os.environ.get("PUSH_BEFORE", "").strip()
          log_messages = ""
          if before and set(before) != {"0"} and len(before) >= 7:
              log_messages = git_text(
                  [f"{before}..HEAD", "--no-merges", "--pretty=format:%s%n%b"]
              )
          if not log_messages:
              log_messages = git_text(
                  ["-15", "--no-merges", "--pretty=format:%s%n%b"]
              )

          dispatch_notes = os.environ.get("DISPATCH_NOTES", "").strip()
          if event == "workflow_dispatch" and dispatch_notes:
              body = dispatch_notes
          else:
              body = git_text(["-15", "--no-merges", "--pretty=format:- %s"])
              if not body:
                  body = f"- {sha or 'build'}"

          jira_keys = unique_scrum_keys(log_messages)
          if jira_keys:
              jira_lines = "\n".join(
                  f"- {key} https://aethelsoft.atlassian.net/browse/{key}"
                  for key in jira_keys
              )
              jira_block = f"Jira:\n{jira_lines}"
              body = f"{body}\n\n{jira_block}" if body else jira_block

          text = cap(header, body)
          Path("release-notes.txt").write_text(text, encoding="utf-8")
          size = len(text.encode("utf-8"))
          print(f"Wrote release-notes.txt ({size} bytes).")
          print(text)

          if event == "workflow_dispatch" and os.environ.get("DISPATCH_GROUPS", "").strip():
              groups = ",".join(one_line_list(os.environ.get("DISPATCH_GROUPS", ""))) or "testers"
          else:
              groups = "testers"

          if event == "workflow_dispatch" and os.environ.get("DISPATCH_TESTERS", "").strip():
              emails = one_line_list(os.environ.get("DISPATCH_TESTERS", ""))
          elif os.environ.get("VAR_TESTERS", "").strip():
              emails = one_line_list(os.environ.get("VAR_TESTERS", ""))
          else:
              emails = []
          emails.append(DEFAULT_TESTER)
          unique = []
          seen = set()
          for email in emails:
              key = email.lower()
              if key in seen:
                  continue
              seen.add(key)
              unique.append(email)
          testers = ",".join(unique)

          output_path = os.environ.get("GITHUB_OUTPUT")
          if output_path:
              with open(output_path, "a", encoding="utf-8") as handle:
                  handle.write(f"testers={testers}\n")
                  handle.write(f"groups={groups}\n")
          print(f"Groups: {groups}")
          print(f"Testers: {testers}")
          PY

      - name: Upload to Firebase App Distribution
        if: steps.lane.outputs.name == 'test'
        uses: wzieba/Firebase-Distribution-Github-Action@v1
        with:
          appId: ${{ secrets.FIREBASE_APP_ID }}
          serviceCredentialsFileContent: ${{ secrets.FIREBASE_SERVICE_ACCOUNT }}
          groups: ${{ steps.notes.outputs.groups }}
          testers: ${{ steps.notes.outputs.testers }}
          file: ${{ steps.apk.outputs.path }}
          releaseNotesFile: release-notes.txt

      - name: Upload staging APK to Firebase App Distribution
        if: steps.lane.outputs.name == 'staging'
        uses: wzieba/Firebase-Distribution-Github-Action@v1
        with:
          appId: ${{ secrets.FIREBASE_APP_ID_STAGING }}
          serviceCredentialsFileContent: ${{ secrets.FIREBASE_SERVICE_ACCOUNT }}
          groups: ${{ steps.notes.outputs.groups }}
          testers: ${{ steps.notes.outputs.testers }}
          file: ${{ steps.apk.outputs.path }}
          releaseNotesFile: release-notes.txt
