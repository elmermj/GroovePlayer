# Build a signed dev-release APK and publish it to Firebase App Distribution.
# Signing and Firebase credentials come from GitHub Actions secrets only.
# Do not echo those values. Distribute setup notes stay local and are not in this repo.

name: Distribute APK

on:
  workflow_dispatch:
    inputs:
      notes:
        description: Release notes shown to testers. Leave empty to use recent commits.
        required: false
        type: string
        default: ""
      groups:
        description: Firebase App Distribution group aliases (comma-separated)
        required: false
        type: string
        default: testers
      testers:
        description: Extra tester emails (comma-separated). matt.elmer24@gmail.com is always included.
        required: false
        type: string
        default: ""
  push:
    branches:
      - test
    paths:
      - "app/**"
      - "gradle/**"
      - "build.gradle.kts"
      - "settings.gradle.kts"
      - "gradle.properties"
      - "gradlew"
      - "gradlew.bat"
      - ".github/workflows/distribute-apk.yml"

permissions:
  contents: read
  actions: write

# Newer push to the same ref cancels an older in-flight run, so a merge batch
# produces one App Tester release. A cancelled run skips its run_number.
concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  distribute:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          # Enough history for the release-notes commit list.
          fetch-depth: 50

      - name: Setup JDK 17
        uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: 17
          cache: gradle

      - name: Setup Android SDK
        uses: android-actions/setup-android@v3
        with:
          packages: platform-tools cmdline-tools;latest platforms;android-36 build-tools;36.0.0

      - name: Decode keystore
        env:
          ANDROID_KEYSTORE_BASE64: ${{ secrets.ANDROID_KEYSTORE_BASE64 }}
        run: |
          set -euo pipefail
          if [ -z "${ANDROID_KEYSTORE_BASE64}" ]; then
            echo "Missing secret ANDROID_KEYSTORE_BASE64."
            exit 1
          fi
          mkdir -p keystore
          printf '%s' "$ANDROID_KEYSTORE_BASE64" | tr -d ' \n\r\t' | base64 -d > keystore/grooveplayer-upload.jks
          if [ ! -s keystore/grooveplayer-upload.jks ]; then
            echo "Keystore decode failed or ANDROID_KEYSTORE_BASE64 is empty."
            exit 1
          fi
          echo "Decoded upload keystore ($(wc -c < keystore/grooveplayer-upload.jks) bytes)."

      - name: Write local.properties
        env:
          RELEASE_STORE_PASSWORD: ${{ secrets.RELEASE_STORE_PASSWORD }}
          RELEASE_KEY_ALIAS: ${{ secrets.RELEASE_KEY_ALIAS }}
          RELEASE_KEY_PASSWORD: ${{ secrets.RELEASE_KEY_PASSWORD }}
        run: |
          set -euo pipefail
          python3 - << 'PY'
          import os
          from pathlib import Path

          keys = ("RELEASE_STORE_PASSWORD", "RELEASE_KEY_ALIAS", "RELEASE_KEY_PASSWORD")
          missing = [key for key in keys if not os.environ.get(key)]
          if missing:
              raise SystemExit("Missing signing secrets: " + ", ".join(missing))

          def prop(value: str) -> str:
              # Java properties escapes. Never print the result.
              out = []
              for ch in value.replace("\n", "").replace("\r", ""):
                  if ch == "\\":
                      out.append("\\\\")
                  elif ord(ch) < 32 or ord(ch) > 126:
                      out.append("\\u%04x" % ord(ch))
                  else:
                      out.append(ch)
              return "".join(out)

          # App Tester installs on physical devices. Bake the Fly API (not 10.0.2.2).
          # Web client ID must match backend verify; defaults match app/build.gradle.kts.
          lines = [
              "RELEASE_STORE_FILE=keystore/grooveplayer-upload.jks",
              f"RELEASE_STORE_PASSWORD={prop(os.environ['RELEASE_STORE_PASSWORD'])}",
              f"RELEASE_KEY_ALIAS={prop(os.environ['RELEASE_KEY_ALIAS'])}",
              f"RELEASE_KEY_PASSWORD={prop(os.environ['RELEASE_KEY_PASSWORD'])}",
              "API_BASE_URL=https://grooveplayer-backend.fly.dev",
              "GOOGLE_WEB_CLIENT_ID=356328665268-h7p2ct3o1k8358itiecp3h6o4r1tjjgo.apps.googleusercontent.com",
              "GOOGLE_ANDROID_CLIENT_ID=356328665268-1t80fc2j091cei383co7tncernl4p00c.apps.googleusercontent.com",
          ]
          Path("local.properties").write_text("\n".join(lines) + "\n", encoding="ascii")
          print("Wrote local.properties (values not shown).")
          PY

      - name: Export version
        run: |
          echo "VERSION_CODE=${{ github.run_number }}" >> "$GITHUB_ENV"
          echo "VERSION_NAME=1.0.${{ github.run_number }}" >> "$GITHUB_ENV"
          echo "VERSION_CODE=${{ github.run_number }}"
          echo "VERSION_NAME=1.0.${{ github.run_number }}"

      - name: Build dev release APK
        env:
          VERSION_CODE: ${{ github.run_number }}
          VERSION_NAME: 1.0.${{ github.run_number }}
        run: |
          echo "VERSION_CODE=${VERSION_CODE}"
          echo "VERSION_NAME=${VERSION_NAME}"
          ./gradlew :app:assembleDevRelease --stacktrace \
            -PversionCode="${VERSION_CODE}" \
            -PversionName="${VERSION_NAME}"

      - name: Check signed APK
        id: apk
        run: |
          set -euo pipefail
          apk="app/build/outputs/apk/dev/release/app-dev-release.apk"
          if [ ! -f "$apk" ]; then
            echo "Signed APK not found at $apk"
            find app/build/outputs/apk -type f -name '*.apk' -print || true
            exit 1
          fi
          if [[ "$apk" == *unsigned* ]]; then
            echo "Refusing to publish an unsigned APK."
            exit 1
          fi
          echo "path=$apk" >> "$GITHUB_OUTPUT"
          echo "APK ready: $apk ($(wc -c < "$apk") bytes)."

      - name: Upload APK artifact
        uses: actions/upload-artifact@v4
        with:
          name: grooveplayer-dev-release
          path: app/build/outputs/apk/dev/release/app-dev-release.apk
          if-no-files-found: error

      - name: Check Firebase secrets
        env:
          FIREBASE_APP_ID: ${{ secrets.FIREBASE_APP_ID }}
          FIREBASE_SERVICE_ACCOUNT: ${{ secrets.FIREBASE_SERVICE_ACCOUNT }}
        run: |
          set -euo pipefail
          if [ -z "${FIREBASE_APP_ID}" ] || [ -z "${FIREBASE_SERVICE_ACCOUNT}" ]; then
            echo "Missing FIREBASE_APP_ID or FIREBASE_SERVICE_ACCOUNT."
            exit 1
          fi
          echo "Firebase App Distribution secrets are present."

      - name: Write release notes
        id: notes
        env:
          DISPATCH_NOTES: ${{ github.event.inputs.notes }}
          DISPATCH_TESTERS: ${{ github.event.inputs.testers }}
          DISPATCH_GROUPS: ${{ github.event.inputs.groups }}
          VAR_TESTERS: ${{ vars.FIREBASE_TESTERS }}
          VERSION_NAME: ${{ env.VERSION_NAME }}
          PUSH_BEFORE: ${{ github.event.before }}
        run: |
          set -euo pipefail
          python3 - << 'PY'
          import os
          import re
          import subprocess
          from pathlib import Path

          # Firebase allows much longer notes. Keep App Tester text under ~2KB.
          MAX_BYTES = 1800
          DEFAULT_TESTER = "matt.elmer24@gmail.com"

          def one_line_list(value: str) -> list[str]:
              items = []
              for chunk in value.replace("\n", ",").replace("\r", ",").split(","):
                  item = " ".join(chunk.split())
                  if item:
                      items.append(item)
              return items

          def cap(header: str, body: str) -> str:
              suffix = "\n...\n"
              full = f"{header}\n\n{body.strip()}\n"
              if len(full.encode("utf-8")) <= MAX_BYTES:
                  return full
              kept = []
              for line in body.strip().splitlines():
                  candidate_body = "\n".join(kept + [line])
                  candidate = f"{header}\n\n{candidate_body}{suffix}"
                  if len(candidate.encode("utf-8")) > MAX_BYTES:
                      break
                  kept.append(line)
              if kept:
                  return f"{header}\n\n" + "\n".join(kept) + suffix
              base = f"{header}{suffix}"
              raw = base.encode("utf-8")
              if len(raw) <= MAX_BYTES:
                  return base
              return raw[:MAX_BYTES].decode("utf-8", errors="ignore")

          event = os.environ.get("GITHUB_EVENT_NAME", "")
          version = os.environ.get("VERSION_NAME") or f"1.0.{os.environ.get('GITHUB_RUN_NUMBER', '0')}"
          sha = os.environ.get("GITHUB_SHA", "")
          short = sha[:7] if sha else "unknown"
          ref = os.environ.get("GITHUB_REF_NAME", "")
          header = f"GroovePlayer {version} ({short})"
          if ref:
              header += f" on {ref}"

          scrum_key = re.compile(r"SCRUM-\d+")

          def git_text(args: list[str]) -> str:
              try:
                  return subprocess.check_output(
                      ["git", "log", *args],
                      text=True,
                      stderr=subprocess.DEVNULL,
                  ).strip()
              except (subprocess.CalledProcessError, FileNotFoundError):
                  return ""

          def unique_scrum_keys(text: str) -> list[str]:
              seen: set[str] = set()
              keys: list[str] = []
              for key in scrum_key.findall(text or ""):
                  if key in seen:
                      continue
                  seen.add(key)
                  keys.append(key)
              return keys

          # Prefer commits on this push. Fall back to the recent log when the
          # previous SHA is missing (manual dispatch) or not in the checkout.
          before = os.environ.get("PUSH_BEFORE", "").strip()
          log_messages = ""
          if before and set(before) != {"0"} and len(before) >= 7:
              log_messages = git_text(
                  [f"{before}..HEAD", "--no-merges", "--pretty=format:%s%n%b"]
              )
          if not log_messages:
              log_messages = git_text(
                  ["-15", "--no-merges", "--pretty=format:%s%n%b"]
              )

          dispatch_notes = os.environ.get("DISPATCH_NOTES", "").strip()
          if event == "workflow_dispatch" and dispatch_notes:
              body = dispatch_notes
          else:
              body = git_text(["-15", "--no-merges", "--pretty=format:- %s"])
              if not body:
                  body = f"- {sha or 'build'}"

          jira_keys = unique_scrum_keys(log_messages)
          if jira_keys:
              jira_lines = "\n".join(
                  f"- {key} https://aethelsoft.atlassian.net/browse/{key}"
                  for key in jira_keys
              )
              jira_block = f"Jira:\n{jira_lines}"
              body = f"{body}\n\n{jira_block}" if body else jira_block

          text = cap(header, body)
          Path("release-notes.txt").write_text(text, encoding="utf-8")
          size = len(text.encode("utf-8"))
          print(f"Wrote release-notes.txt ({size} bytes).")
          print(text)

          if event == "workflow_dispatch" and os.environ.get("DISPATCH_GROUPS", "").strip():
              groups = ",".join(one_line_list(os.environ.get("DISPATCH_GROUPS", ""))) or "testers"
          else:
              groups = "testers"

          if event == "workflow_dispatch" and os.environ.get("DISPATCH_TESTERS", "").strip():
              emails = one_line_list(os.environ.get("DISPATCH_TESTERS", ""))
          elif os.environ.get("VAR_TESTERS", "").strip():
              emails = one_line_list(os.environ.get("VAR_TESTERS", ""))
          else:
              emails = []
          emails.append(DEFAULT_TESTER)
          unique = []
          seen = set()
          for email in emails:
              key = email.lower()
              if key in seen:
                  continue
              seen.add(key)
              unique.append(email)
          testers = ",".join(unique)

          output_path = os.environ.get("GITHUB_OUTPUT")
          if output_path:
              with open(output_path, "a", encoding="utf-8") as handle:
                  handle.write(f"testers={testers}\n")
                  handle.write(f"groups={groups}\n")
          print(f"Groups: {groups}")
          print(f"Testers: {testers}")
          PY

      - name: Upload to Firebase App Distribution
        uses: wzieba/Firebase-Distribution-Github-Action@v1
        with:
          appId: ${{ secrets.FIREBASE_APP_ID }}
          serviceCredentialsFileContent: ${{ secrets.FIREBASE_SERVICE_ACCOUNT }}
          groups: ${{ steps.notes.outputs.groups }}
          testers: ${{ steps.notes.outputs.testers }}
          file: ${{ steps.apk.outputs.path }}
          releaseNotesFile: release-notes.txt
