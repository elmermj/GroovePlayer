# Build a signed dev-release APK and publish it to Firebase App Distribution.
# Signing and Firebase credentials come from GitHub Actions secrets only.
# Do not echo those values. See app/DISTRIBUTE.md.

name: Distribute APK

on:
  workflow_dispatch:
    inputs:
      notes:
        description: Release notes shown to testers
        required: false
        type: string
        default: ""
      groups:
        description: Firebase App Distribution group aliases (comma-separated)
        required: false
        type: string
        default: testers
  push:
    branches:
      - test
    paths:
      - "app/**"
      - "gradle/**"
      - "build.gradle.kts"
      - "settings.gradle.kts"
      - "gradle.properties"
      - "gradlew"
      - "gradlew.bat"
      - ".github/workflows/distribute-apk.yml"

permissions:
  contents: read
  actions: write

jobs:
  distribute:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup JDK 17
        uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: 17
          cache: gradle

      - name: Setup Android SDK
        uses: android-actions/setup-android@v3
        with:
          packages: platform-tools cmdline-tools;latest platforms;android-36 build-tools;36.0.0

      - name: Decode keystore
        env:
          ANDROID_KEYSTORE_BASE64: ${{ secrets.ANDROID_KEYSTORE_BASE64 }}
        run: |
          set -euo pipefail
          if [ -z "${ANDROID_KEYSTORE_BASE64}" ]; then
            echo "Missing secret ANDROID_KEYSTORE_BASE64."
            exit 1
          fi
          mkdir -p keystore
          printf '%s' "$ANDROID_KEYSTORE_BASE64" | tr -d ' \n\r\t' | base64 -d > keystore/grooveplayer-upload.jks
          if [ ! -s keystore/grooveplayer-upload.jks ]; then
            echo "Keystore decode failed or ANDROID_KEYSTORE_BASE64 is empty."
            exit 1
          fi
          echo "Decoded upload keystore ($(wc -c < keystore/grooveplayer-upload.jks) bytes)."

      - name: Write local.properties
        env:
          RELEASE_STORE_PASSWORD: ${{ secrets.RELEASE_STORE_PASSWORD }}
          RELEASE_KEY_ALIAS: ${{ secrets.RELEASE_KEY_ALIAS }}
          RELEASE_KEY_PASSWORD: ${{ secrets.RELEASE_KEY_PASSWORD }}
        run: |
          set -euo pipefail
          python3 - << 'PY'
          import os
          from pathlib import Path

          keys = ("RELEASE_STORE_PASSWORD", "RELEASE_KEY_ALIAS", "RELEASE_KEY_PASSWORD")
          missing = [key for key in keys if not os.environ.get(key)]
          if missing:
              raise SystemExit("Missing signing secrets: " + ", ".join(missing))

          def prop(value: str) -> str:
              # Java properties escapes. Never print the result.
              out = []
              for ch in value.replace("\n", "").replace("\r", ""):
                  if ch == "\\":
                      out.append("\\\\")
                  elif ord(ch) < 32 or ord(ch) > 126:
                      out.append("\\u%04x" % ord(ch))
                  else:
                      out.append(ch)
              return "".join(out)

          lines = [
              "RELEASE_STORE_FILE=keystore/grooveplayer-upload.jks",
              f"RELEASE_STORE_PASSWORD={prop(os.environ['RELEASE_STORE_PASSWORD'])}",
              f"RELEASE_KEY_ALIAS={prop(os.environ['RELEASE_KEY_ALIAS'])}",
              f"RELEASE_KEY_PASSWORD={prop(os.environ['RELEASE_KEY_PASSWORD'])}",
          ]
          Path("local.properties").write_text("\n".join(lines) + "\n", encoding="ascii")
          print("Wrote local.properties (values not shown).")
          PY

      - name: Export version
        run: |
          echo "VERSION_CODE=${{ github.run_number }}" >> "$GITHUB_ENV"
          echo "VERSION_NAME=1.0.${{ github.run_number }}" >> "$GITHUB_ENV"
          echo "VERSION_CODE=${{ github.run_number }}"
          echo "VERSION_NAME=1.0.${{ github.run_number }}"

      - name: Build dev release APK
        env:
          VERSION_CODE: ${{ github.run_number }}
          VERSION_NAME: 1.0.${{ github.run_number }}
        run: |
          echo "VERSION_CODE=${VERSION_CODE}"
          echo "VERSION_NAME=${VERSION_NAME}"
          ./gradlew :app:assembleDevRelease --stacktrace

      - name: Check signed APK
        id: apk
        run: |
          set -euo pipefail
          apk="app/build/outputs/apk/dev/release/app-dev-release.apk"
          if [ ! -f "$apk" ]; then
            echo "Signed APK not found at $apk"
            find app/build/outputs/apk -type f -name '*.apk' -print || true
            exit 1
          fi
          if [[ "$apk" == *unsigned* ]]; then
            echo "Refusing to publish an unsigned APK."
            exit 1
          fi
          echo "path=$apk" >> "$GITHUB_OUTPUT"
          echo "APK ready: $apk ($(wc -c < "$apk") bytes)."

      - name: Upload APK artifact
        uses: actions/upload-artifact@v4
        with:
          name: grooveplayer-dev-release
          path: app/build/outputs/apk/dev/release/app-dev-release.apk
          if-no-files-found: error

      - name: Check Firebase secrets
        env:
          FIREBASE_APP_ID: ${{ secrets.FIREBASE_APP_ID }}
          FIREBASE_SERVICE_ACCOUNT: ${{ secrets.FIREBASE_SERVICE_ACCOUNT }}
        run: |
          set -euo pipefail
          if [ -z "${FIREBASE_APP_ID}" ] || [ -z "${FIREBASE_SERVICE_ACCOUNT}" ]; then
            echo "Missing FIREBASE_APP_ID or FIREBASE_SERVICE_ACCOUNT."
            exit 1
          fi
          echo "Firebase App Distribution secrets are present."

      - name: Write release notes
        env:
          NOTES: ${{ github.event_name == 'workflow_dispatch' && github.event.inputs.notes || '' }}
        run: |
          set -euo pipefail
          printf '%s\n' "Commit: $GITHUB_SHA" > release-notes.txt
          if [ -n "${NOTES:-}" ]; then
            printf '%s\n' "$NOTES" >> release-notes.txt
          fi

      - name: Upload to Firebase App Distribution
        uses: wzieba/Firebase-Distribution-Github-Action@v1
        with:
          appId: ${{ secrets.FIREBASE_APP_ID }}
          serviceCredentialsFileContent: ${{ secrets.FIREBASE_SERVICE_ACCOUNT }}
          groups: ${{ github.event_name == 'workflow_dispatch' && github.event.inputs.groups || 'testers' }}
          file: ${{ steps.apk.outputs.path }}
          releaseNotesFile: release-notes.txt
